<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Testimonial – KENZ Guitar Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #D4AF37;
      --gold2: #F0C84A;
      --gold-dim: rgba(212,175,55,0.12);
      --gold-border: rgba(212,175,55,0.3);
      --text: #0F0D08;
      --muted: #6B6459;
      --bg: #F7F4EE;
      --surface: #FFFFFF;
      --surface2: #F0EDE5;
      --border: #E2DDD4;
      --nav-bg: rgba(247,244,238,0.92);
      --green: #2D8A5F;
      --green-dim: rgba(45,138,95,0.12);
      --red: #C84040;
      --red-dim: rgba(200,64,64,0.12);
      --radius: 16px;
      --shadow: 0 2px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    }
    [data-theme="dark"] {
      --text: #F0EDE5;
      --muted: #9A9080;
      --bg: #0C0A06;
      --surface: #181510;
      --surface2: #201C14;
      --border: #2A2518;
      --nav-bg: rgba(12,10,6,0.92);
      --gold-dim: rgba(212,175,55,0.10);
      --shadow: 0 2px 16px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .35s, color .35s;
      min-height: 100vh;
    }

    /* NAVBAR */
    nav {
      position: sticky; top: 0; z-index: 200;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background .35s, border-color .35s;
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 64px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      font-family: 'Georgia', 'Times New Roman', serif; font-size: 22px; font-weight: 700;
      color: var(--gold);
    }
    .nav-right { display: flex; align-items: center; gap: 14px; }

    .theme-toggle {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px;
      font-size: 17px; cursor: pointer;
      transition: background .2s, border-color .2s;
      line-height: 1;
    }
    .theme-toggle:hover { border-color: var(--gold); }

    .btn-back {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 16px;
      font-size: 14px; font-weight: 600; color: var(--text);
      cursor: pointer; transition: all .2s;
    }
    .btn-back:hover { border-color: var(--gold); color: var(--gold); }

    /* MAIN WRAP */
    .main-wrap {
      max-width: 1400px; margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* PAGE HEADER */
    .page-header {
      margin-bottom: 24px;
    }
    .page-header h1 {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(26px, 5vw, 40px);
      font-weight: 700; line-height: 1.15;
      color: var(--text);
    }
    .page-header h1 span { color: var(--gold); }
    .page-header p {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 14px; font-style: italic;
      color: var(--muted); margin-top: 5px;
    }

    /* SECTION CARD */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: background .35s, border-color .35s;
      margin-bottom: 20px;
    }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }
    .section-head h2 {
      font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700;
      color: var(--text);
    }
    .section-body { padding: 22px; }

    /* TESTIMONIAL GRID */
    .testimonial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .testimonial-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all .3s;
    }
    .testimonial-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .testimonial-stars {
      color: var(--gold);
      font-size: 18px;
      margin-bottom: 12px;
    }
    .testimonial-quote {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 16px;
      font-style: italic;
    }
    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .testimonial-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
    }
    .testimonial-info {
      flex: 1;
    }
    .testimonial-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .testimonial-role {
      font-size: 12px;
      color: var(--muted);
    }
    .testimonial-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-action {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .2s;
    }
    .btn-edit {
      background: var(--blue-dim);
      color: var(--blue);
    }
    .btn-edit:hover { background: var(--blue); color: #fff; }
    .btn-delete {
      background: var(--red-dim);
      color: var(--red);
    }
    .btn-delete:hover { background: var(--red); color: #fff; }

    /* ADD BUTTON */
    .btn-add {
      background: var(--gold); border: none;
      border-radius: 10px; padding: 10px 20px;
      font-size: 14px; font-weight: 600; color: #0A0A0A;
      cursor: pointer; transition: all .2s;
    }
    .btn-add:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); width: 100%; max-width: 500px;
      padding: 24px;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-header h3 {
      font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700;
      color: var(--text);
    }
    .modal-close {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; color: var(--muted);
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); margin-bottom: 6px; text-transform: uppercase;
    }
    .form-input, .form-textarea {
      width: 100%; padding: 10px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; color: var(--text);
      outline: none; transition: border-color .2s;
    }
    .form-textarea {
      min-height: 100px; resize: vertical;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--gold); }
    .btn-submit {
      width: 100%; background: var(--gold); border: none;
      border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600;
      color: #0A0A0A; cursor: pointer; transition: all .2s;
    }
    .btn-submit:hover { transform: translateY(-2px); }

    @media (max-width: 640px) {
      .nav-inner { padding: 0 14px; height: 56px; }
      .nav-brand { font-size: 18px; gap: 8px; }
      .main-wrap { padding: 16px 12px 60px; }
      .testimonial-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-inner">
    <a href="adminsiswa.html" class="nav-brand">
      <span id="nav-logo-fallback">🎸</span>
      <span id="nav-nama-usaha">KENZ.</span>
    </a>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle">☀️</button>
      <a href="adminsiswa.html" class="btn-back">← Kembali</a>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div class="main-wrap">
  <div class="page-header">
    <h1>TESTIMONIAL <span>SISWA</span></h1>
    <p>Kelola testimoni siswa KENZ Private Guitar Lesson</p>
  </div>

  <!-- TESTIMONIAL SECTION -->
  <div class="section-card">
    <div class="section-head">
      <h2>Daftar Testimoni</h2>
      <button class="btn-add" id="btn-add">+ Tambah</button>
    </div>
    <div class="section-body">
      <div class="testimonial-grid" id="testimonial-grid">
        <!-- Testimonial items will be loaded here -->
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Tambah Testimoni</h3>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <form id="testimonial-form">
      <input type="hidden" id="testimonial-id">
      <div class="form-group">
        <label class="form-label">Nama Siswa</label>
        <input type="text" class="form-input" id="testimonial-name" placeholder="Nama lengkap" required>
      </div>
      <div class="form-group">
        <label class="form-label">Role / Keterangan</label>
        <input type="text" class="form-input" id="testimonial-role" placeholder="Contoh: Siswa · 2 bulan">
      </div>
      <div class="form-group">
        <label class="form-label">Rating (1-5)</label>
        <select class="form-input" id="testimonial-rating">
          <option value="5">⭐⭐⭐⭐⭐ (5)</option>
          <option value="4">⭐⭐⭐⭐ (4)</option>
          <option value="3">⭐⭐⭐ (3)</option>
          <option value="2">⭐⭐ (2)</option>
          <option value="1">⭐ (1)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Testimoni</label>
        <textarea class="form-textarea" id="testimonial-quote" placeholder="Tulis testimoni siswa..." required></textarea>
      </div>
      <button type="submit" class="btn-submit">Simpan</button>
    </form>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://pedhdhvybqfnxucvrkzj.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZGhkaHZ5YnFmbnh1Y3Zya3pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjU1MzIsImV4cCI6MjA5NTk0MTUzMn0.oPu3fkqNMWlb_7cTq738vHmKc6d4WiYiCBo9sMv3K7k';
  const headers = {
    'apikey': SUPABASE_ANON,
    'Authorization': `Bearer ${SUPABASE_ANON}`,
    'Content-Type': 'application/json'
  };

  let testimonials = [];

  // Theme Toggle
  const html = document.documentElement;
  const themeToggle = document.getElementById('theme-toggle');
  themeToggle.addEventListener('click', () => {
    applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('kenz-theme', theme);
  }
  applyTheme(localStorage.getItem('kenz-theme') || 'light');

  // Modal
  const modal = document.getElementById('modal-overlay');
  document.getElementById('btn-add').addEventListener('click', () => {
    // Get logged-in student data
    const loginData = JSON.parse(localStorage.getItem('kenz-login') || 'null');
    
    // Check if testimonial already exists for this student
    const existingTestimonial = testimonials.find(t => t.nama_siswa === loginData?.nama);
    if (existingTestimonial) {
      alert('Anda sudah memiliki testimoni. Silakan edit testimoni yang sudah ada.');
      return;
    }

    document.getElementById('modal-title').textContent = 'Tambah Testimoni';
    document.getElementById('testimonial-form').reset();
    document.getElementById('testimonial-id').value = '';
    
    // Auto-fill with student data
    if (loginData) {
      document.getElementById('testimonial-name').value = loginData.nama || '';
      document.getElementById('testimonial-role').value = loginData.level ? `Siswa · ${loginData.level}` : 'Siswa';
      document.getElementById('testimonial-name').readOnly = true;
      document.getElementById('testimonial-role').readOnly = true;
    }
    
    modal.classList.add('open');
  });
  document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if(e.target === modal) modal.classList.remove('open'); });

  // Form Submit
  document.getElementById('testimonial-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('testimonial-id').value;
    const name = document.getElementById('testimonial-name').value;
    const role = document.getElementById('testimonial-role').value;
    const rating = document.getElementById('testimonial-rating').value;
    const quote = document.getElementById('testimonial-quote').value;

    const payload = {
      id: id ? parseInt(id) : Date.now(),
      nama_siswa: name,
      keterangan: role,
      rating: String(rating),
      testimoni: quote
    };

    try {
      let res;
      if (id) {
        // Update
        res = await fetch(`${SUPABASE_URL}/rest/v1/testimoni?id=eq.${id}`, {
          method: 'PATCH',
          headers,
          body: JSON.stringify(payload)
        });
      } else {
        // Insert
        res = await fetch(`${SUPABASE_URL}/rest/v1/testimoni`, {
          method: 'POST',
          headers,
          body: JSON.stringify(payload)
        });
      }

      if (!res.ok) {
        const errorText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errorText}`);
      }
      
      modal.classList.remove('open');
      loadTestimonials();
      alert('Berhasil disimpan!');
    } catch (err) {
      alert('Gagal: ' + err.message);
    }
  });

  // Load Testimonials
  async function loadTestimonials() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/testimoni`, { headers });
      const data = await res.json();
      testimonials = Array.isArray(data) ? data : [];
      renderTestimonials();
    } catch (err) {
      console.error('Gagal memuat testimoni:', err);
      testimonials = [];
      renderTestimonials();
    }
  }

  // Render Testimonials
  function renderTestimonials() {
    const grid = document.getElementById('testimonial-grid');
    grid.innerHTML = '';

    if (!testimonials || testimonials.length === 0) {
      grid.innerHTML = '<p style="color:var(--muted);">Belum ada testimoni.</p>';
      return;
    }

    testimonials.forEach(item => {
      const stars = '⭐'.repeat(parseInt(item.rating) || 0);
      const div = document.createElement('div');
      div.className = 'testimonial-card';
      div.innerHTML = `
        <div class="testimonial-stars">${stars}</div>
        <div class="testimonial-quote">"${item.testimoni}"</div>
        <div class="testimonial-author">
          <div class="testimonial-avatar">${item.nama_siswa.charAt(0).toUpperCase()}</div>
          <div class="testimonial-info">
            <div class="testimonial-name">${item.nama_siswa}</div>
            <div class="testimonial-role">${item.keterangan || 'Siswa'}</div>
          </div>
        </div>
        <div class="testimonial-actions">
          <button class="btn-action btn-edit" onclick="editTestimonial('${item.id}')">Edit</button>
          <button class="btn-action btn-delete" onclick="deleteTestimonial('${item.id}')">Hapus</button>
        </div>
      `;
      grid.appendChild(div);
    });
  }

  // Edit Testimonial
  function editTestimonial(id) {
    const item = testimonials.find(t => t.id === id);
    if (!item) return;

    document.getElementById('modal-title').textContent = 'Edit Testimoni';
    document.getElementById('testimonial-id').value = item.id;
    document.getElementById('testimonial-name').value = item.nama_siswa;
    document.getElementById('testimonial-role').value = item.keterangan || '';
    document.getElementById('testimonial-rating').value = item.rating;
    document.getElementById('testimonial-quote').value = item.testimoni;
    modal.classList.add('open');
  }

  // Delete Testimonial
  async function deleteTestimonial(id) {
    if (!confirm('Yakin ingin menghapus testimoni ini?')) return;
    
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/testimoni?id=eq.${id}`, {
        method: 'DELETE',
        headers
      });
      if (!res.ok) throw new Error('Gagal menghapus');
      loadTestimonials();
      alert('Berhasil dihapus!');
    } catch (err) {
      alert('Gagal: ' + err.message);
    }
  }

  // Initial Load
  loadTestimonials();
</script>
</body>
</html>
