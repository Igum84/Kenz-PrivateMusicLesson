<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SPP Siswa – KENZ Guitar Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #D4AF37;
      --gold2: #F0C84A;
      --gold-dim: rgba(212,175,55,0.12);
      --gold-border: rgba(212,175,55,0.3);
      --text: #0F0D08;
      --muted: #6B6459;
      --bg: #F7F4EE;
      --surface: #FFFFFF;
      --surface2: #F0EDE5;
      --border: #E2DDD4;
      --nav-bg: rgba(247,244,238,0.92);
      --footer-bg: #0F0D08;
      --footer-text: #5A5249;
      --green: #2D8A5F;
      --green-dim: rgba(45,138,95,0.12);
      --blue: #2D5FA8;
      --blue-dim: rgba(45,95,168,0.12);
      --purple: #7A3EA6;
      --purple-dim: rgba(122,62,166,0.12);
      --red: #C84040;
      --red-dim: rgba(200,64,64,0.12);
      --radius: 16px;
      --shadow: 0 2px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    }
    [data-theme="dark"] {
      --text: #F0EDE5;
      --muted: #9A9080;
      --bg: #0C0A06;
      --surface: #181510;
      --surface2: #201C14;
      --border: #2A2518;
      --nav-bg: rgba(12,10,6,0.92);
      --footer-bg: #080604;
      --footer-text: #3A3228;
      --gold-dim: rgba(212,175,55,0.10);
      --shadow: 0 2px 16px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .35s, color .35s;
      min-height: 100vh;
    }

    /* ============ NAVBAR ============ */
    nav {
      position: sticky; top: 0; z-index: 200;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background .35s, border-color .35s;
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 64px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      font-family: 'Georgia', 'Times New Roman', serif; font-size: 22px; font-weight: 700;
      color: var(--gold);
    }
    .nav-brand img { height: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .nav-right { display: flex; align-items: center; gap: 14px; }

    .theme-toggle {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px;
      font-size: 17px; cursor: pointer;
      transition: background .2s, border-color .2s;
      line-height: 1;
    }
    .theme-toggle:hover { border-color: var(--gold); }

    .admin-info {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px 7px 7px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 50px;
      transition: background .35s, border-color .35s;
      position: relative;
    }
    .admin-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #7A5020);
      display: flex; align-items: center; justify-content: center;
      color: #0A0A0A; font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }
    .admin-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .admin-role { font-size: 11px; color: var(--muted); }

    /* ============ MAIN WRAP ============ */
    .main-wrap {
      max-width: 1400px; margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ============ PAGE HEADER ============ */
    .page-header {
      margin-bottom: 20px;
    }
    .page-header h1 {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(24px, 4.5vw, 36px);
      font-weight: 700; line-height: 1.15;
      color: var(--text);
    }
    .page-header h1 span { color: var(--gold); }
    .page-header p {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 14px; font-style: italic;
      color: var(--muted); margin-top: 5px;
    }

    /* ============ ACTION BAR ============ */
    .action-bar {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-bottom: 22px;
    }
    .action-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px; font-weight: 700;
      cursor: pointer; text-decoration: none;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
    }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn.primary {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border-color: var(--gold);
      color: #0A0A0A;
      box-shadow: 0 4px 14px rgba(212,175,55,0.25);
    }
    .action-btn.primary:hover { box-shadow: 0 6px 20px rgba(212,175,55,0.35); }
    .action-btn.secondary:hover {
      border-color: var(--gold); color: var(--gold); background: var(--gold-dim);
    }
    .action-btn .icon { font-size: 16px; line-height: 1; }

    /* ============ SECTION CARD ============ */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: background .35s, border-color .35s;
    }
    .section-head {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }
    .section-head h2 {
      font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
      color: var(--text);
    }
    .section-head .badge {
      font-size: 11px; padding: 3px 10px;
      background: var(--gold-dim); color: var(--gold);
      border-radius: 50px; font-weight: 600; border: 1px solid var(--gold-border);
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 12px;
    }
    .search-box input {
      border: none; background: none; outline: none;
      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
      width: 180px;
    }
    .search-box input::placeholder { color: var(--muted); }

    /* ============ TABLE ============ */
    .table-wrap { overflow-x: auto; }
    table.riwayat-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px;
      min-width: 720px;
    }
    table.riwayat-table thead th {
      text-align: left; font-family: 'Syne', sans-serif; font-size: 11.5px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      color: var(--muted);
      background: var(--surface2);
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.riwayat-table tbody td {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    table.riwayat-table tbody tr:last-child td { border-bottom: none; }
    table.riwayat-table tbody tr:hover { background: var(--surface2); }
    .siswa-cell { display: flex; align-items: center; gap: 10px; }
    .siswa-ava {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--gold);
      flex-shrink: 0;
    }
    .siswa-name { font-weight: 600; }
    .amount-cell { font-weight: 700; color: var(--green); white-space: nowrap; }
    .status-pill {
      font-size: 10.5px; font-weight: 700; padding: 4px 11px;
      border-radius: 99px; display: inline-block; white-space: nowrap;
    }
    .status-pill.lunas { background: var(--green-dim); color: var(--green); }
    .status-pill.pending { background: rgba(212,175,55,0.15); color: #B08C1A; }
    .row-action-btn {
      border: 1px solid var(--red-dim); background: var(--red-dim); color: var(--red);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .2s, border-color .2s;
    }
    .row-action-btn:hover { background: rgba(200,64,64,0.22); border-color: var(--red); }
    .empty-state, .loading-state {
      padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px;
    }

    /* ============ TABS ============ */
    .tabs-bar {
      display: flex; gap: 4px; flex-wrap: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 12px 22px 0;
      scrollbar-width: thin;
    }
    .tabs-bar::-webkit-scrollbar { height: 4px; }
    .tabs-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .tab-item {
      flex-shrink: 0; white-space: nowrap;
      padding: 10px 16px;
      border: none; background: none;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); cursor: pointer;
      border-radius: 10px 10px 0 0;
      border-bottom: 2px solid transparent;
      transition: color .2s, background .2s, border-color .2s;
    }
    .tab-item:hover { color: var(--text); background: var(--surface2); }
    .tab-item.active { color: var(--gold); background: var(--gold-dim); border-bottom-color: var(--gold); }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .tab-toolbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 10px; padding: 16px 22px;
      border-top: 1px solid var(--border);
    }

    /* ============ MODAL ============ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,13,8,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .2s ease, visibility .2s;
      padding: 20px;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-lg);
      width: 100%; max-width: 440px;
      transform: translateY(14px);
      transition: transform .2s ease;
    }
    .modal-overlay.open .modal-box { transform: translateY(0); }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-bottom: 1px solid var(--border);
    }
    .modal-head h3 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
    .modal-close {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; width: 30px; height: 30px; cursor: pointer;
      color: var(--muted); font-size: 15px; line-height: 1;
    }
    .modal-close:hover { border-color: var(--red); color: var(--red); }
    .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .form-group input, .form-group select {
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface2);
      font-family: 'DM Sans', sans-serif; font-size: 13.5px; color: var(--text);
      outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--gold); }
    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow-lg);
      max-height: 190px; overflow-y: auto; z-index: 50;
      display: none;
    }
    .autocomplete-list.open { display: block; }
    .autocomplete-item {
      padding: 9px 12px; font-size: 13px; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item.active { background: var(--surface); color: var(--gold); }
    .autocomplete-item .ac-id { font-size: 11px; color: var(--muted); margin-left: 6px; }
    .autocomplete-empty { padding: 9px 12px; font-size: 12.5px; color: var(--muted); }
    .modal-foot {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 16px 22px; border-top: 1px solid var(--border);
    }
    .btn-cancel {
      padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      cursor: pointer;
    }
    .btn-save {
      padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 13px;
      background: linear-gradient(135deg, var(--gold), var(--gold2)); border: none; color: #0A0A0A;
      cursor: pointer;
    }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; }

    /* ============ FOOTER ============ */
    footer {
      background: var(--footer-bg);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 24px;
      margin-top: 30px;
    }
    .footer-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      color: var(--footer-text); font-size: 13px;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 640px) {
      .nav-inner { padding: 0 14px; height: 56px; }
      .nav-brand { font-size: 18px; gap: 8px; }
      .nav-brand img { height: 26px; }
      .admin-info { padding: 0; background: none; border: none; }
      .admin-info .admin-name, .admin-info .admin-role { display: none; }
      .admin-info .admin-avatar { width: 36px; height: 36px; }
      .main-wrap { padding: 16px 12px 60px; }
      .page-header h1 { font-size: 22px; }
      .action-bar { gap: 8px; }
      .action-btn { padding: 10px 14px; font-size: 12.5px; flex: 1 1 auto; justify-content: center; }
      .section-head { padding: 14px 16px; }
      .footer-inner { flex-direction: column; gap: 10px; text-align: center; font-size: 12px; }
    }

    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  </style>
</head>

<nav>

<script>
  /* ===== CONFIG ===== */
  const SUPABASE_URL  = 'https://pedhdhvybqfnxucvrkzj.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZGhkaHZ5YnFmbnh1Y3Zya3pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjU1MzIsImV4cCI6MjA5NTk0MTUzMn0.oPu3fkqNMWlb_7cTq738vHmKc6d4WiYiCBo9sMv3K7k';
  /* Daftar tab SPP: key = id unik (tanpa spasi), jenis = nilai kolom jenis_spp di DB, label = teks tab */
  const SPP_TYPES = [
    { key: 'basic-dasar',          jenis: 'Basic Dasar',          label: 'SPP Basic Dasar',          detailed: true },
    { key: 'basic-lanjutan',       jenis: 'Basic Lanjutan',       label: 'SPP Basic Lanjutan',        detailed: true },
    { key: 'intermediate-dasar',   jenis: 'Intermediate Dasar',   label: 'SPP Intermediate Dasar',    detailed: true },
    { key: 'intermediate-lanjutan',jenis: 'Intermediate Lanjutan',label: 'SPP Intermediate Lanjutan', detailed: true },
    { key: 'performer-dasar',      jenis: 'Performer Dasar',      label: 'SPP Performer Dasar' },
    { key: 'performer-lanjutan',   jenis: 'Performer Lanjutan',   label: 'SPP Performer Lanjutan' }
  ];

  /* Jumlah kolom "Sesi" (tgl_bayar_sX / bayar_sX) untuk tab detailed */
  const JUMLAH_SESI_KOLOM = 8;
  /* Total kolom tabel detailed: No, ID Siswa, Nama Siswa, Nominal Persesi, Jumlah Sesi,
     (Sesi X + Jumlah Bayar) x8, Total Terbayar, Sisa Iuran, Status, Aksi */
  const DETAILED_COLSPAN = 5 + (JUMLAH_SESI_KOLOM * 2) + 4;

  function buildDetailedTheadCells() {
    let sesiCells = '';
    for (let i = 1; i <= JUMLAH_SESI_KOLOM; i++) {
      sesiCells += `<th>Sesi ${i}</th><th>Jumlah Bayar</th>`;
    }
    return `
      <th>No</th>
      <th>ID Siswa</th>
      <th>Nama Siswa</th>
      <th>Nominal Persesi</th>
      <th>Jumlah Sesi</th>
      ${sesiCells}
      <th>Total Terbayar</th>
      <th>Sisa Iuran</th>
      <th>Status</th>
      <th>Aksi</th>
    `;
  }

  let activeTabKey = SPP_TYPES[0].key;
  const riwayatDataMap = {};   // cache data per tab: { key: [rows] }
  const loadedTabs = {};       // penanda tab yang sudah pernah dimuat

  const headers = {
    'apikey': SUPABASE_ANON,
    'Authorization': `Bearer ${SUPABASE_ANON}`
  };
  const headersWrite = {
    ...headers,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  /* ===== THEME ===== */
  const html = document.documentElement;
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(t) {
    html.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('kenz-theme', t);
  }
  applyTheme(localStorage.getItem('kenz-theme') || 'light');
  themeToggle.addEventListener('click', () => {
    applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ===== NAVBAR ===== */
  async function loadNavbar() {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/identitas?select=logo,nama_usaha,owner&limit=1`, { headers });
      const rows = await r.json();
      if (!rows?.length) return;
      const { logo, nama_usaha, owner } = rows[0];
      if (logo) {
        const img = document.getElementById('nav-logo');
        img.src = logo; img.style.display = 'block';
        document.getElementById('nav-logo-fallback').style.display = 'none';
      }
      if (nama_usaha) document.getElementById('nav-nama-usaha').textContent = nama_usaha;
      if (owner) {
        document.getElementById('nav-owner').textContent = owner;
        document.getElementById('nav-avatar').textContent = owner.charAt(0).toUpperCase();
        document.getElementById('nav-tooltip').textContent = owner;
      }
    } catch(e) { console.warn('Navbar:', e.message); }
  }
  loadNavbar();

  /* ===== BUILD TABS ===== */
  function buildTabs() {
    const tabsBar = document.getElementById('tabs-bar');
    const tabPanes = document.getElementById('tab-panes');

    tabsBar.innerHTML = SPP_TYPES.map((t, i) => `
      <button class="tab-item${i === 0 ? ' active' : ''}" id="tab-btn-${t.key}" onclick="switchTab('${t.key}')">${t.label}</button>
    `).join('');

    tabPanes.innerHTML = SPP_TYPES.map((t, i) => `
      <div class="tab-pane${i === 0 ? ' active' : ''}" id="tab-pane-${t.key}">
        <div class="tab-toolbar">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="badge" id="badge-${t.key}">— data</span>
            <div class="search-box">
              <span style="font-size:13px;color:var(--muted);">🔍</span>
              <input type="text" id="search-${t.key}" placeholder="Cari nama siswa..." oninput="filterTable('${t.key}')">
            </div>
          </div>
          <button class="action-btn primary" onclick="openPaymentModal('${t.key}')">
            <span class="icon">+</span> Pembayaran
          </button>
        </div>
        <div class="table-wrap">
          <table class="riwayat-table">
            <thead>
              <tr>
                ${t.detailed ? buildDetailedTheadCells() : `
                <th>No</th>
                <th>Nama Siswa</th>
                <th>Tanggal Bayar</th>
                <th>Jumlah</th>
                <th>Metode</th>
                <th>Status</th>
                <th>Aksi</th>
                `}
              </tr>
            </thead>
            <tbody id="riwayat-body-${t.key}">
              <tr><td colspan="${t.detailed ? DETAILED_COLSPAN : 7}" class="loading-state">Memuat data pembayaran…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `).join('');
  }

  function switchTab(key) {
    activeTabKey = key;
    SPP_TYPES.forEach(t => {
      document.getElementById(`tab-btn-${t.key}`).classList.toggle('active', t.key === key);
      document.getElementById(`tab-pane-${t.key}`).classList.toggle('active', t.key === key);
    });
    if (!loadedTabs[key]) loadRiwayat(key);
  }

  /* ===== MODAL MAPPING SISWA ===== */
  function populateMappingLevelOptions() {
    const sel = document.getElementById('mapping-input-level');
    if (sel.dataset.filled) return;
    sel.innerHTML = SPP_TYPES.map(t => `<option value="${t.jenis}">${t.label}</option>`).join('');
    sel.dataset.filled = '1';
  }

  function openMappingModal() {
    populateMappingLevelOptions();
    const type = SPP_TYPES.find(t => t.key === activeTabKey) || SPP_TYPES[0];
    document.getElementById('mapping-input-level').value = type.jenis;
    document.getElementById('mapping-input-id').value = '';
    document.getElementById('mapping-input-nama').value = '';
    document.getElementById('mapping-input-nominal').value = '';
    closeMappingSuggestions();
    document.getElementById('mapping-modal').classList.add('open');
  }
  function closeMappingModal() {
    document.getElementById('mapping-modal').classList.remove('open');
  }
  document.getElementById('mapping-modal').addEventListener('click', (e) => {
    if (e.target.id === 'mapping-modal') closeMappingModal();
  });

  /* ===== AUTOCOMPLETE NAMA SISWA (tabel: datasiswa) ===== */
  const mappingNamaInput = document.getElementById('mapping-input-nama');
  const mappingIdInput   = document.getElementById('mapping-input-id');
  const mappingSuggestBox = document.getElementById('mapping-nama-suggestions');
  let mappingSuggestTimer = null;
  let mappingSuggestActiveIndex = -1;
  let mappingSuggestItems = [];

  function closeMappingSuggestions() {
    mappingSuggestBox.classList.remove('open');
    mappingSuggestBox.innerHTML = '';
    mappingSuggestActiveIndex = -1;
    mappingSuggestItems = [];
  }

  function renderMappingSuggestions(rows) {
    if (!rows || rows.length === 0) {
      mappingSuggestBox.innerHTML = '<div class="autocomplete-empty">Nama tidak ditemukan</div>';
      mappingSuggestBox.classList.add('open');
      mappingSuggestItems = [];
      return;
    }
    mappingSuggestItems = rows;
    mappingSuggestBox.innerHTML = rows.map((row, i) => `
      <div class="autocomplete-item" data-index="${i}">
        ${row.nama_siswa}<span class="ac-id">ID: ${row.id}</span>
      </div>
    `).join('');
    mappingSuggestBox.classList.add('open');
    mappingSuggestBox.querySelectorAll('.autocomplete-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.index, 10);
        pickMappingSuggestion(mappingSuggestItems[idx]);
      });
    });
  }

  function pickMappingSuggestion(row) {
    mappingNamaInput.value = row.nama_siswa;
    mappingIdInput.value = row.id;
    closeMappingSuggestions();
  }

  async function searchDataSiswa(keyword) {
    try {
      const filter = keyword
        ? `&nama_siswa=ilike.*${encodeURIComponent(keyword)}*`
        : '';
      const url = `${SUPABASE_URL}/rest/v1/datasiswa?select=id,nama_siswa${filter}&order=nama_siswa.asc&limit=10`;
      const r = await fetch(url, { headers });
      if (!r.ok) throw new Error('Gagal mengambil data siswa');
      return await r.json();
    } catch (e) {
      console.warn('searchDataSiswa:', e.message);
      return [];
    }
  }

  function triggerMappingSuggestions() {
    const keyword = mappingNamaInput.value.trim();
    clearTimeout(mappingSuggestTimer);
    mappingSuggestTimer = setTimeout(async () => {
      const rows = await searchDataSiswa(keyword);
      renderMappingSuggestions(rows);
    }, 250);
  }

  mappingNamaInput.addEventListener('input', () => {
    mappingIdInput.value = ''; // reset id selama nama masih diketik/berubah manual
    triggerMappingSuggestions();
  });

  mappingNamaInput.addEventListener('focus', triggerMappingSuggestions);
  mappingNamaInput.addEventListener('click', triggerMappingSuggestions);

  mappingNamaInput.addEventListener('keydown', (e) => {
    const items = mappingSuggestBox.querySelectorAll('.autocomplete-item');
    if (!items.length || !mappingSuggestBox.classList.contains('open')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      mappingSuggestActiveIndex = Math.min(mappingSuggestActiveIndex + 1, items.length - 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      mappingSuggestActiveIndex = Math.max(mappingSuggestActiveIndex - 1, 0);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (mappingSuggestActiveIndex >= 0 && mappingSuggestItems[mappingSuggestActiveIndex]) {
        pickMappingSuggestion(mappingSuggestItems[mappingSuggestActiveIndex]);
      }
      return;
    } else if (e.key === 'Escape') {
      closeMappingSuggestions();
      return;
    } else {
      return;
    }
    items.forEach((el, i) => el.classList.toggle('active', i === mappingSuggestActiveIndex));
  });

  document.addEventListener('click', (e) => {
    if (e.target !== mappingNamaInput && !mappingSuggestBox.contains(e.target)) {
      closeMappingSuggestions();
    }
  });

  async function simpanMappingSiswa() {
    const level = document.getElementById('mapping-input-level').value;
    const idSiswa = document.getElementById('mapping-input-id').value.trim();
    const namaSiswa = document.getElementById('mapping-input-nama').value.trim();
    const nominal = parseFloat(document.getElementById('mapping-input-nominal').value);

    if (!level || !idSiswa || !namaSiswa || !nominal) {
      alert('Mohon lengkapi Level, ID Siswa, Nama Siswa, dan Nominal.');
      return;
    }

    const type = SPP_TYPES.find(t => t.jenis === level);
    if (!type) {
      alert('Level tidak dikenali.');
      return;
    }

    const tableName = LEVEL_TABLE_MAP[type.jenis];
    if (!tableName) {
      alert(`Tabel Supabase untuk level "${type.label}" belum dikonfigurasi.`);
      return;
    }

    const btn = document.getElementById('btn-mapping-konfirmasi');
    btn.disabled = true; btn.textContent = 'Menyimpan…';

    try {
      /* Payload sesuai struktur tabel sppbasicdasar (id_siswa, nama_siswa,
         nominal_persesi, jumlah_sesi, tgl_bayar_s1..s8, bayar_s1..s8,
         total_terbayar, sisa_iuran, status). */
      const payload = {
        id_siswa: idSiswa,
        nama_siswa: namaSiswa,
        nominal_persesi: nominal,
        jumlah_sesi: JUMLAH_SESI_KOLOM,
        total_terbayar: 0,
        sisa_iuran: nominal * JUMLAH_SESI_KOLOM,
        status: 'pending'
      };
      for (let i = 1; i <= JUMLAH_SESI_KOLOM; i++) {
        payload[`tgl_bayar_s${i}`] = null;
        payload[`bayar_s${i}`] = null;
      }

      const r = await fetch(`${SUPABASE_URL}/rest/v1/${tableName}`, {
        method: 'POST',
        headers: headersWrite,
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error(`Gagal menyimpan mapping siswa ke tabel ${tableName}`);
      closeMappingModal();
      loadedTabs[type.key] = false;
      loadRiwayat(type.key);
    } catch(e) {
      console.warn('Simpan mapping siswa:', e.message);
      alert(`Gagal menyimpan mapping siswa. Periksa koneksi atau struktur tabel Supabase (${tableName}).`);
    } finally {
      btn.disabled = false; btn.textContent = 'Konfirmasi';
    }
  }

  /* ===== MODAL TAMBAH PEMBAYARAN ===== */
  let modalTabKey = null;

  function openPaymentModal(key) {
    modalTabKey = key || activeTabKey;
    const type = SPP_TYPES.find(t => t.key === modalTabKey);
    document.getElementById('modal-title').textContent = `+ Pembayaran ${type ? type.label : 'SPP'}`;
    document.getElementById('input-nama').value = '';
    document.getElementById('input-tanggal').value = new Date().toISOString().slice(0,10);
    document.getElementById('input-jumlah').value = '';
    document.getElementById('input-metode').value = 'Tunai';
    document.getElementById('input-status').value = 'lunas';
    document.getElementById('payment-modal').classList.add('open');
  }
  function closePaymentModal() {
    document.getElementById('payment-modal').classList.remove('open');
  }
  document.getElementById('payment-modal').addEventListener('click', (e) => {
    if (e.target.id === 'payment-modal') closePaymentModal();
  });

  async function simpanPembayaran() {
    const nama = document.getElementById('input-nama').value.trim();
    const tanggal = document.getElementById('input-tanggal').value;
    const jumlah = parseFloat(document.getElementById('input-jumlah').value);
    const metode = document.getElementById('input-metode').value;
    const status = document.getElementById('input-status').value;

    if (!nama || !tanggal || !jumlah) {
      alert('Mohon lengkapi nama siswa, tanggal, dan jumlah pembayaran.');
      return;
    }

    const btn = document.getElementById('btn-simpan');
    btn.disabled = true; btn.textContent = 'Menyimpan…';

    try {
      const type = SPP_TYPES.find(t => t.key === modalTabKey) || SPP_TYPES[0];
      const payload = {
        nama_siswa: nama,
        tanggal: tanggal,
        jumlah: jumlah,
        metode: metode,
        status: status,
        jenis_spp: type.jenis
      };
      const r = await fetch(`${SUPABASE_URL}/rest/v1/pembayaran`, {
        method: 'POST',
        headers: headersWrite,
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error('Gagal menyimpan ke server');
      closePaymentModal();
      loadRiwayat(type.key);
    } catch(e) {
      console.warn('Simpan pembayaran:', e.message);
      alert('Gagal menyimpan pembayaran. Periksa koneksi atau struktur tabel Supabase.');
    } finally {
      btn.disabled = false; btn.textContent = 'Simpan';
    }
  }

  /* ===== HAPUS PEMBAYARAN ===== */
  async function hapusPembayaran(id, btn, key) {
    if (!confirm('Hapus data pembayaran ini?')) return;
    btn.disabled = true;
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/pembayaran?id=eq.${id}`, {
        method: 'DELETE',
        headers
      });
      if (!r.ok) throw new Error('Gagal menghapus');
      loadRiwayat(key);
    } catch(e) {
      console.warn('Hapus pembayaran:', e.message);
      alert('Gagal menghapus data. Data demo tidak tersambung ke server.');
      btn.disabled = false;
    }
  }

  /* ===== LOAD RIWAYAT PEMBAYARAN (per tab) ===== */
  async function loadRiwayat(key) {
    const type = SPP_TYPES.find(t => t.key === key);
    if (!type) return;
    const tbody = document.getElementById(`riwayat-body-${key}`);
    const colspan = type.detailed ? DETAILED_COLSPAN : 7;
    tbody.innerHTML = `<tr><td colspan="${colspan}" class="loading-state">Memuat data pembayaran…</td></tr>`;
    try {
      const url = type.detailed
        ? `${SUPABASE_URL}/rest/v1/${LEVEL_TABLE_MAP[type.jenis]}?select=${DETAILED_SELECT_FIELDS}&order=nama_siswa.asc`
        : `${SUPABASE_URL}/rest/v1/pembayaran?select=id,nama_siswa,tanggal,jumlah,metode,status,jenis_spp&jenis_spp=eq.${encodeURIComponent(type.jenis)}&order=tanggal.desc`;
      const r = await fetch(url, { headers });
      const rows = await r.json();
      if (!Array.isArray(rows) || rows.length === 0) throw new Error('kosong');
      riwayatDataMap[key] = rows;
      renderRiwayat(key, rows);
    } catch(e) {
      console.warn(`Riwayat (${type.jenis}):`, e.message);
      riwayatDataMap[key] = type.detailed ? getDemoDataDetailed(type.jenis) : getDemoData(type.jenis);
      renderRiwayat(key, riwayatDataMap[key]);
    } finally {
      loadedTabs[key] = true;
    }
  }

  /* Setiap level SPP (khusus tipe "detailed") disimpan di tabel terpisah,
     bukan lagi satu tabel spp_siswa dengan kolom jenis_spp. */
  const LEVEL_TABLE_MAP = {
    'Basic Dasar': 'sppbasicdasar',
    'Basic Lanjutan': 'sppbasiclanjutan',
    'Intermediate Dasar': 'sppintermediatedasar',
    'Intermediate Lanjutan': 'sppintermediatelanjutan'
  };

  const DETAILED_SELECT_FIELDS = [
    'id_siswa','nama_siswa','nominal_persesi','jumlah_sesi',
    'tgl_bayar_s1','bayar_s1','tgl_bayar_s2','bayar_s2',
    'tgl_bayar_s3','bayar_s3','tgl_bayar_s4','bayar_s4',
    'tgl_bayar_s5','bayar_s5','tgl_bayar_s6','bayar_s6',
    'tgl_bayar_s7','bayar_s7','tgl_bayar_s8','bayar_s8',
    'total_terbayar','sisa_iuran','status'
  ].join(',');

  function renderRiwayat(key, rows) {
    const type = SPP_TYPES.find(t => t.key === key);
    if (type && type.detailed) { renderRiwayatDetailed(key, rows); return; }

    const tbody = document.getElementById(`riwayat-body-${key}`);
    const badge = document.getElementById(`badge-${key}`);
    badge.textContent = `${rows.length} data`;

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Belum ada riwayat pembayaran untuk ${type ? type.label : 'SPP ini'}.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((p, i) => {
      const init = (p.nama_siswa || '?').charAt(0).toUpperCase();
      const statusClass = (p.status || '').toLowerCase().includes('lunas') ? 'lunas' : 'pending';
      const statusLabel = statusClass === 'lunas' ? 'Lunas' : 'Pending';
      const amount = parseFloat(p.jumlah || 0).toLocaleString('id-ID');
      const tgl = p.tanggal ? new Date(p.tanggal).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '-';
      return `<tr data-nama="${(p.nama_siswa||'').toLowerCase()}">
        <td>${i + 1}</td>
        <td>
          <div class="siswa-cell">
            <div class="siswa-ava">${init}</div>
            <span class="siswa-name">${p.nama_siswa || '-'}</span>
          </div>
        </td>
        <td>${tgl}</td>
        <td class="amount-cell">Rp ${amount}</td>
        <td>${p.metode || '-'}</td>
        <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
        <td><button class="row-action-btn" onclick="hapusPembayaran(${p.id}, this, '${key}')">Hapus</button></td>
      </tr>`;
    }).join('');
  }

  function fmtTgl(v) {
    return v ? new Date(v).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'}) : '-';
  }
  function fmtRp(v) {
    return v || v === 0 ? `Rp ${parseFloat(v).toLocaleString('id-ID')}` : '-';
  }

  function renderRiwayatDetailed(key, rows) {
    const type = SPP_TYPES.find(t => t.key === key);
    const tbody = document.getElementById(`riwayat-body-${key}`);
    const badge = document.getElementById(`badge-${key}`);
    badge.textContent = `${rows.length} data`;

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${DETAILED_COLSPAN}" class="empty-state">Belum ada data siswa untuk ${type ? type.label : 'SPP ini'}.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((p, i) => {
      const statusClass = (p.status || '').toLowerCase().includes('lunas') ? 'lunas' : 'pending';
      const statusLabel = statusClass === 'lunas' ? 'Lunas' : 'Pending';

      let sesiCells = '';
      for (let s = 1; s <= JUMLAH_SESI_KOLOM; s++) {
        sesiCells += `<td>${fmtTgl(p[`tgl_bayar_s${s}`])}</td><td class="amount-cell">${fmtRp(p[`bayar_s${s}`])}</td>`;
      }

      return `<tr data-nama="${(p.nama_siswa||'').toLowerCase()}">
        <td>${i + 1}</td>
        <td>${p.id_siswa ?? '-'}</td>
        <td>
          <div class="siswa-cell">
            <div class="siswa-ava">${(p.nama_siswa || '?').charAt(0).toUpperCase()}</div>
            <span class="siswa-name">${p.nama_siswa || '-'}</span>
          </div>
        </td>
        <td>${fmtRp(p.nominal_persesi)}</td>
        <td>${p.jumlah_sesi ?? '-'}</td>
        ${sesiCells}
        <td class="amount-cell">${fmtRp(p.total_terbayar)}</td>
        <td class="amount-cell">${fmtRp(p.sisa_iuran)}</td>
        <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
        <td><button class="row-action-btn" onclick="hapusPembayaran(${p.id_siswa}, this, '${key}')">Hapus</button></td>
      </tr>`;
    }).join('');
  }

  function filterTable(key) {
    const q = document.getElementById(`search-${key}`).value.trim().toLowerCase();
    const source = riwayatDataMap[key] || [];
    const filtered = q ? source.filter(p => (p.nama_siswa || '').toLowerCase().includes(q)) : source;
    renderRiwayat(key, filtered);
  }

  /* ===== INIT ===== */
  buildTabs();
  loadRiwayat(activeTabKey); // muat tab pertama saja, tab lain dimuat saat diklik
</script>
</body>
</html>
