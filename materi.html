<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Materi Pembelajaran – KENZ Guitar Lesson</title>
  <style>
    /* ===== TOKENS (sama dengan adminsiswa.html) ===== */
    :root {
      --gold: #D4AF37;
      --gold2: #F0C84A;
      --gold-dim: rgba(212,175,55,0.12);
      --gold-border: rgba(212,175,55,0.3);
      --text: #0F0D08;
      --muted: #6B6459;
      --bg: #F7F4EE;
      --surface: #FFFFFF;
      --surface2: #F0EDE5;
      --border: #E2DDD4;
      --nav-bg: rgba(247,244,238,0.92);
      --footer-bg: #0F0D08;
      --footer-text: #5A5249;
      --green: #2D8A5F;
      --green-dim: rgba(45,138,95,0.12);
      --blue: #2D5FA8;
      --blue-dim: rgba(45,95,168,0.12);
      --purple: #7A3EA6;
      --purple-dim: rgba(122,62,166,0.12);
      --red: #C84040;
      --red-dim: rgba(200,64,64,0.12);
      --radius: 16px;
      --shadow: 0 2px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
      --font: 'Times New Roman', Times, Georgia, serif;
    }
    [data-theme="dark"] {
      --text: #F0EDE5;
      --muted: #9A9080;
      --bg: #0C0A06;
      --surface: #181510;
      --surface2: #201C14;
      --border: #2A2518;
      --nav-bg: rgba(12,10,6,0.92);
      --footer-bg: #080604;
      --footer-text: #3A3228;
      --gold-dim: rgba(212,175,55,0.10);
      --shadow: 0 2px 16px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background .35s, color .35s;
      min-height: 100vh;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: sticky; top: 0; z-index: 200;
      background: #0F0D08;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212,175,55,0.18);
      box-shadow: 0 2px 20px rgba(0,0,0,0.45);
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 64px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      font-family: var(--font); font-size: 22px; font-weight: 700;
      color: var(--gold);
    }
    .nav-brand img { height: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .nav-back {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(212,175,55,0.2);
      border-radius: 10px; padding: 7px 14px;
      color: #F0EDE5; font-size: 13px; font-weight: 600;
      text-decoration: none; font-family: var(--font);
      transition: background .2s, border-color .2s;
    }
    .nav-back:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .theme-toggle {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px; padding: 8px 10px;
      font-size: 17px; cursor: pointer;
      transition: background .2s, border-color .2s; line-height: 1;
    }
    .theme-toggle:hover { border-color: var(--gold); background: rgba(212,175,55,0.12); }
    .admin-info {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px 7px 7px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(212,175,55,0.2);
      border-radius: 50px;
    }
    .admin-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #7A5020);
      display: flex; align-items: center; justify-content: center;
      color: #0A0A0A; font-weight: 700; font-size: 14px; flex-shrink: 0;
      overflow: hidden;
    }
    .admin-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .admin-name { font-size: 13px; font-weight: 600; color: #F0EDE5; font-family: var(--font); }
    .admin-role { font-size: 11px; color: #9A9080; font-family: var(--font); }

    /* ===== MAIN ===== */
    .main-wrap {
      padding: 24px 10px 80px;
    }

    /* ===== ANIMATIONS ===== */
    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    .fi-1{animation-delay:.05s} .fi-2{animation-delay:.10s} .fi-3{animation-delay:.15s}

    /* ===== IDENTITAS SISWA CARD ===== */
    .identitas-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: hidden;
      transition: background .35s, border-color .35s;
    }
    .identitas-banner {
      height: 6px;
      background: linear-gradient(90deg, #1a1200, #7A5020, var(--gold), #7A5020, #1a1200);
    }
    .identitas-body {
      padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .identitas-photo {
      width: 58px; height: 58px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #7A5020);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #0A0A0A;
      flex-shrink: 0; overflow: hidden;
      border: 3px solid var(--gold-border);
      box-shadow: 0 2px 12px rgba(212,175,55,0.25);
    }
    .identitas-photo img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .identitas-info { flex: 1; min-width: 0; }
    .identitas-nama {
      font-family: var(--font); font-size: 17px; font-weight: 700;
      color: var(--text); line-height: 1.2; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .identitas-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .identitas-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      color: var(--gold); border-radius: 99px;
      padding: 2px 10px; font-size: 11px; font-weight: 700;
      font-family: var(--font);
    }
    .identitas-sep { color: var(--border); font-size: 12px; }
    .identitas-instrumen {
      font-size: 12px; color: var(--muted); font-family: var(--font);
    }
    .identitas-right {
      text-align: right; flex-shrink: 0;
    }
    .identitas-id {
      font-size: 11px; color: var(--muted); font-family: var(--font);
      margin-bottom: 2px;
    }
    .identitas-id span {
      font-weight: 700; color: var(--gold);
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ===== MATERI SECTION ===== */
    .materi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: background .35s, border-color .35s;
    }
    .materi-card-header {
      padding: 14px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      display: flex; align-items: center; gap: 10px;
    }
    .materi-card-header-icon { font-size: 18px; }
    .materi-card-title {
      font-family: var(--font); font-size: 14px; font-weight: 700;
      color: var(--gold); letter-spacing: .3px;
    }
    .materi-count {
      margin-left: auto;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      color: var(--gold); border-radius: 99px;
      padding: 2px 10px; font-size: 11px; font-weight: 700;
      font-family: var(--font);
    }

    /* ===== TAB BAR ===== */
    .tab-bar-wrap {
      position: relative;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .tab-bar {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      scroll-behavior: smooth;
      gap: 0;
      padding: 0 6px;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      background: none; border: none;
      padding: 12px 18px;
      font-family: var(--font); font-size: 13px; font-weight: 700;
      color: var(--muted); cursor: pointer;
      position: relative; white-space: nowrap;
      transition: color .2s;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn::after {
      content: '';
      position: absolute; bottom: -1px; left: 0; right: 0; height: 3px;
      background: var(--gold);
      transform: scaleX(0); transition: transform .25s cubic-bezier(.4,0,.2,1);
      border-radius: 2px 2px 0 0;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: #F0EDE5;
      background: #0F0D08;
      border-radius: 8px 8px 0 0;
    }
    .tab-btn.active::after { transform: scaleX(0); }

    /* scroll arrows di tab bar */
    .tab-arrow {
      position: absolute; top: 0; bottom: 0;
      width: 36px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(to right, var(--surface2), transparent);
      border: none; cursor: pointer; z-index: 10; font-size: 14px; color: var(--muted);
      transition: color .2s;
    }
    .tab-arrow:hover { color: var(--gold); }
    .tab-arrow.right { right: 0; background: linear-gradient(to left, var(--surface2), transparent); }
    .tab-arrow.left { left: 0; }

    /* tombol Next / Previous navigasi tab */
    .tab-nav-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      gap: 10px;
    }
    .btn-tab-nav {
      display: inline-flex; align-items: center; gap: 7px;
      background: #0F0D08; color: var(--gold);
      border: 1.5px solid rgba(212,175,55,0.3);
      border-radius: 10px; padding: 9px 18px;
      font-family: var(--font); font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s, opacity .2s;
    }
    .btn-tab-nav:hover:not(:disabled) {
      background: #1e1a10; border-color: var(--gold);
      transform: translateY(-1px);
    }
    .btn-tab-nav:disabled {
      opacity: .3; cursor: default; transform: none;
    }
    .tab-nav-indicator {
      font-family: var(--font); font-size: 12px; color: var(--muted);
      text-align: center; flex: 1;
    }
    .tab-nav-indicator strong { color: var(--gold); }

    /* ===== TAB CONTENT ===== */
    .tab-panel { display: none; padding: 20px; }
    .tab-panel.active { display: block; animation: fadeIn .3s ease; }

    .materi-nama-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px;
      font-family: var(--font);
    }
    .materi-nama-value {
      font-family: var(--font); font-size: 18px; font-weight: 700;
      color: var(--text); margin-bottom: 6px; line-height: 1.3;
    }
    .materi-deskripsi {
      font-family: var(--font); font-size: 13px; color: var(--muted);
      line-height: 1.7; margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--surface2); border-left: 3px solid var(--gold-border);
      border-radius: 0 10px 10px 0;
      text-align: justify;
    }

    /* PDF embed area */
    .pdf-wrap {
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      background: var(--surface2);
      position: relative;
    }
    .pdf-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      gap: 10px; flex-wrap: wrap;
    }
    .pdf-toolbar-left {
      display: flex; align-items: center; gap: 8px;
    }
    .pdf-icon { font-size: 18px; }
    .pdf-label {
      font-family: var(--font); font-size: 12px; font-weight: 700;
      color: var(--text);
    }
    .pdf-sublabel {
      font-family: var(--font); font-size: 11px; color: var(--muted);
    }
    .btn-pdf-open {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--gold); color: #0A0A0A;
      border: none; border-radius: 8px; padding: 7px 14px;
      font-family: var(--font); font-size: 12px; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: opacity .2s, transform .15s;
      flex-shrink: 0;
    }
    .btn-pdf-open:hover { opacity: .88; transform: translateY(-1px); }

    .pdf-frame-wrap {
      position: relative;
      width: 100%; height: 520px;
      background: var(--surface2);
    }
    .pdf-frame-wrap iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    .pdf-loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: var(--surface2);
    }
    .pdf-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pdf-loading-text {
      font-family: var(--font); font-size: 13px; color: var(--muted);
    }
    .pdf-no-file {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 48px 20px; text-align: center;
    }
    .pdf-no-file-icon { font-size: 40px; opacity: .4; }
    .pdf-no-file-text { font-family: var(--font); font-size: 13px; color: var(--muted); }

    /* ===== EMPTY & ERROR STATE ===== */
    .state-box {
      padding: 48px 20px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .state-icon { font-size: 42px; opacity: .35; }
    .state-text { font-family: var(--font); font-size: 14px; color: var(--muted); line-height: 1.6; }
    .state-level {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      color: var(--gold); border-radius: 99px;
      padding: 4px 14px; font-size: 12px; font-weight: 700;
      font-family: var(--font);
    }

    /* ===== SKELETON MATERI ===== */
    .materi-skeleton { padding: 20px; display: flex; flex-direction: column; gap: 12px; }

    /* ===== FOOTER ===== */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--footer-bg);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 20px 24px;
      z-index: 100;
    }
    .footer-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      color: var(--footer-text); font-size: 12px; font-family: var(--font);
      flex-wrap: wrap; gap: 8px;
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width:640px){
      .nav-inner { padding: 0 14px; height: 56px; }
      .nav-brand { font-size: 18px; gap: 8px; }
      .nav-brand img { height: 26px; }
      .admin-info { display: none; }
      .main-wrap { padding: 16px 12px 72px; }
      .identitas-right { display: none; }
      .pdf-frame-wrap { height: 380px; }
      .tab-btn { padding: 10px 14px; font-size: 12px; }
    }
    @media(min-width:641px){
      .main-wrap { padding: 24px 10px 80px; }
    }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav>
  <div class="nav-inner">
    <a href="adminsiswa.html" class="nav-brand">
      <img id="nav-logo" src="logo.png" alt="KENZ" style="display:none">
      <span id="nav-logo-fallback">🎸</span>
      <span id="nav-nama-usaha">KENZ.</span>
    </a>
    <div class="nav-right">
      <a href="adminsiswa.html" class="nav-back">← Portal Siswa</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">☀️</button>
      <div class="admin-info">
        <div class="admin-avatar" id="nav-avatar">S</div>
        <div>
          <div class="admin-name" id="nav-siswa-nama">Nama Siswa</div>
          <div class="admin-role">Siswa Aktif</div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- ===== MAIN ===== -->
<div class="main-wrap">

  <!-- SKELETON IDENTITAS -->
  <div id="identitas-skeleton" class="identitas-card fade-in" style="padding:16px 20px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="skeleton" style="width:58px;height:58px;border-radius:50%;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div class="skeleton" style="height:16px;border-radius:6px;margin-bottom:8px;width:50%;"></div>
        <div class="skeleton" style="height:12px;border-radius:6px;width:35%;"></div>
      </div>
    </div>
  </div>

  <!-- IDENTITAS SISWA CARD -->
  <div id="identitas-card" class="identitas-card fade-in fi-1" style="display:none;">
    <div class="identitas-banner"></div>
    <div class="identitas-body">
      <div class="identitas-photo" id="id-photo-el">S</div>
      <div class="identitas-info">
        <div class="identitas-nama" id="id-nama">—</div>
        <div class="identitas-meta">
          <div class="identitas-badge">⭐ <span id="id-level">Basic</span></div>
          <span class="identitas-sep">·</span>
          <span class="identitas-instrumen" id="id-instrumen">—</span>
        </div>
      </div>
      <div class="identitas-right">
        <div class="identitas-id">ID Siswa: <span id="id-siswa">—</span></div>
      </div>
    </div>
  </div>

  <!-- MATERI CARD -->
  <div class="materi-card fade-in fi-2">
    <div class="materi-card-header">
      <span class="materi-card-header-icon">📖</span>
      <span class="materi-card-title">MATERI PEMBELAJARAN</span>
      <span class="materi-count" id="materi-count" style="display:none;"></span>
    </div>

    <!-- SKELETON TAB -->
    <div id="materi-skeleton" class="materi-skeleton">
      <div style="display:flex;gap:8px;padding:12px 6px 0;border-bottom:1px solid var(--border);">
        <div class="skeleton" style="height:38px;width:80px;border-radius:8px;"></div>
        <div class="skeleton" style="height:38px;width:80px;border-radius:8px;"></div>
        <div class="skeleton" style="height:38px;width:80px;border-radius:8px;"></div>
        <div class="skeleton" style="height:38px;width:80px;border-radius:8px;"></div>
      </div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:10px;">
        <div class="skeleton" style="height:24px;width:55%;border-radius:8px;"></div>
        <div class="skeleton" style="height:14px;width:80%;border-radius:6px;"></div>
        <div class="skeleton" style="height:14px;width:70%;border-radius:6px;"></div>
        <div class="skeleton" style="height:380px;border-radius:12px;margin-top:8px;"></div>
      </div>
    </div>

    <!-- TAB CONTENT (diisi JS) -->
    <div id="materi-content" style="display:none;">
      <!-- Tab Bar -->
      <div class="tab-bar-wrap">
        <button class="tab-arrow left" id="tab-arrow-left" onclick="scrollTabBar(-120)">‹</button>
        <div class="tab-bar" id="tab-bar"></div>
        <button class="tab-arrow right" id="tab-arrow-right" onclick="scrollTabBar(120)">›</button>
      </div>
      <!-- Panels -->
      <div id="tab-panels"></div>
      <!-- Next / Previous -->
      <div class="tab-nav-row" id="tab-nav-row" style="display:none;">
        <button class="btn-tab-nav" id="btn-prev" onclick="navTab(-1)">← Previous</button>
        <div class="tab-nav-indicator" id="tab-nav-indicator">1 / 1</div>
        <button class="btn-tab-nav" id="btn-next" onclick="navTab(1)">Next →</button>
      </div>
    </div>

    <!-- EMPTY STATE -->
    <div id="materi-empty" style="display:none;">
      <div class="state-box">
        <div class="state-icon">📚</div>
        <div class="state-text">
          Belum ada materi untuk level
          <br><strong id="empty-level-label"></strong>
        </div>
      </div>
    </div>

    <!-- ERROR STATE -->
    <div id="materi-error" style="display:none;">
      <div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-text" id="error-msg-text">Gagal memuat materi. Periksa koneksi internet.</div>
      </div>
    </div>

  </div><!-- /materi-card -->

</div><!-- /main-wrap -->

<!-- FOOTER -->
<footer>
  <div class="footer-inner">
    <span>🎸 KENZ Guitar Lesson</span>
    <span>Materi Pembelajaran &copy; <span id="footer-year">2025</span></span>
  </div>
</footer>

<script>
  /* ===== THEME ===== */
  const html     = document.documentElement;
  const themeBtn = document.getElementById('theme-toggle');
  const saved    = localStorage.getItem('kenz-theme') || 'light';
  html.setAttribute('data-theme', saved);
  themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('kenz-theme', next);
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  /* ===== LOGO ===== */
  const logoImg = document.getElementById('nav-logo');
  const logoFb  = document.getElementById('nav-logo-fallback');
  logoImg.onload  = () => { logoImg.style.display = 'block'; logoFb.style.display = 'none'; };
  logoImg.onerror = () => { logoImg.style.display = 'none';  logoFb.style.display = 'inline'; };

  /* ===== FOOTER YEAR ===== */
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  /* ===== SUPABASE CONFIG ===== */
  const SUPA_URL = 'https://pedhdhvybqfnxucvrkzj.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZGhkaHZ5YnFmbnh1Y3Zya3pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjU1MzIsImV4cCI6MjA5NTk0MTUzMn0.oPu3fkqNMWlb_7cTq738vHmKc6d4WiYiCBo9sMv3K7k';
  const HEADERS  = { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` };

  /* ===== HELPERS ===== */
  function setEl(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  /* ===== IDENTITAS SISWA ===== */
  let loginData = null;

  function renderIdentitas(data) {
    const inisial = (data.nama || 'S').charAt(0).toUpperCase();

    // Navbar
    const navAvatar = document.getElementById('nav-avatar');
    if (data.photo) {
      navAvatar.innerHTML = `<img src="${data.photo}" alt="${inisial}">`;
    } else {
      navAvatar.textContent = inisial;
    }
    setEl('nav-siswa-nama', data.nama || '—');

    // Card identitas
    const photoEl = document.getElementById('id-photo-el');
    if (data.photo) {
      photoEl.innerHTML = `<img src="${data.photo}" alt="${inisial}">`;
    } else {
      photoEl.textContent = inisial;
    }
    setEl('id-nama',      data.nama      || '—');
    setEl('id-level',     data.level     || '—');
    setEl('id-instrumen', data.instrumen || '—');
    setEl('id-siswa',     data.id        || '—');

    document.getElementById('identitas-skeleton').style.display = 'none';
    document.getElementById('identitas-card').style.display     = 'block';
  }

  /* ===== LOAD MATERI ===== */
  function showMateriState(state) {
    document.getElementById('materi-skeleton').style.display = 'none';
    document.getElementById('materi-content').style.display  = state === 'content' ? 'block' : 'none';
    document.getElementById('materi-empty').style.display    = state === 'empty'   ? 'block' : 'none';
    document.getElementById('materi-error').style.display    = state === 'error'   ? 'block' : 'none';
  }

  let activeTab  = 0;
  let totalTabs  = 0;

  function buildTabs(rows) {
    totalTabs = rows.length;
    const tabBar    = document.getElementById('tab-bar');
    const tabPanels = document.getElementById('tab-panels');
    tabBar.innerHTML    = '';
    tabPanels.innerHTML = '';

    rows.forEach((row, i) => {
      /* ---- Tab button ---- */
      const btn = document.createElement('button');
      btn.className    = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.textContent  = row.materi || `Materi ${i + 1}`;
      btn.dataset.index = i;
      btn.addEventListener('click', () => switchTab(i));
      tabBar.appendChild(btn);

      /* ---- Panel ---- */
      const panel = document.createElement('div');
      panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
      panel.id = `panel-${i}`;

      const hasPdf = row.filepdf && row.filepdf.trim() !== '';
      const pdfUrl = hasPdf
        ? `${SUPA_URL}/storage/v1/object/public/aset/${row.filepdf.replace(/^\//, '')}`
        : null;

      // Jika filepdf sudah berupa URL lengkap gunakan langsung
      const finalPdfUrl = (hasPdf && row.filepdf.startsWith('http')) ? row.filepdf : pdfUrl;

      /*
       * Deteksi platform:
       * - iOS (iPhone/iPad/iPod): render PDF native langsung di iframe — Google Docs Viewer justru sering gagal di Safari
       * - Android              : tidak bisa render PDF di iframe → wajib pakai Google Docs Viewer
       * - Desktop              : render PDF native langsung di iframe
       */
      const ua       = navigator.userAgent;
      const isIOS    = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /Android/.test(ua);

      const iframeSrc = finalPdfUrl
        ? (isAndroid
            ? `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(finalPdfUrl)}`
            : finalPdfUrl)   // iOS & desktop: URL langsung
        : null;

      panel.innerHTML = `
        <div class="materi-nama-label">Nama Materi</div>
        <div class="materi-nama-value">${row.materi || '—'}</div>
        ${row.deskripsi ? `<div class="materi-deskripsi">${row.deskripsi}</div>` : ''}
        <div class="pdf-wrap">
          <div class="pdf-toolbar">
            <div class="pdf-toolbar-left">
              <span class="pdf-icon">📄</span>
              <div>
                <div class="pdf-label">File Materi PDF</div>
                <div class="pdf-sublabel">${row.materi || ''}</div>
              </div>
            </div>
            ${finalPdfUrl
              ? `<a class="btn-pdf-open" href="${finalPdfUrl}" target="_blank" rel="noopener">↗ Unduh PDF</a>`
              : ''}
          </div>
          ${iframeSrc
            ? `<div class="pdf-frame-wrap">
                 <div class="pdf-loading" id="pdf-loading-${i}">
                   <div class="pdf-spinner"></div>
                   <div class="pdf-loading-text">Memuat PDF…</div>
                 </div>
                 <iframe
                   src="${iframeSrc}"
                   title="${row.materi || 'Materi'}"
                   onload="document.getElementById('pdf-loading-${i}').style.display='none'"
                   onerror="document.getElementById('pdf-loading-${i}').innerHTML='<span style=font-size:28px>⚠️</span><span style=font-size:13px;color:var(--muted)>Gagal memuat PDF</span>'"
                 ></iframe>
               </div>`
            : `<div class="pdf-no-file">
                 <div class="pdf-no-file-icon">📂</div>
                 <div class="pdf-no-file-text">File PDF belum tersedia untuk materi ini.</div>
               </div>`
          }
        </div>
      `;
      tabPanels.appendChild(panel);
    });

    // Update count badge
    const countEl = document.getElementById('materi-count');
    countEl.textContent = `${rows.length} Materi`;
    countEl.style.display = 'inline-flex';

    // Tampilkan tombol next/prev jika lebih dari 1 tab
    if (rows.length > 1) {
      document.getElementById('tab-nav-row').style.display = 'flex';
    }

    activeTab = 0;
    updateNavButtons();
    updateArrows();
    document.getElementById('tab-bar').addEventListener('scroll', updateArrows);
  }

  function switchTab(index) {
    activeTab = index;
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.tab-panel').forEach((panel, i) => {
      panel.classList.toggle('active', i === index);
    });
    // Scroll tab button into view
    const btn = document.querySelector(`.tab-btn[data-index="${index}"]`);
    if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    updateNavButtons();
  }

  function navTab(dir) {
    const next = activeTab + dir;
    if (next < 0 || next >= totalTabs) return;
    switchTab(next);
    // Scroll ke atas konten materi
    document.querySelector('.materi-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function updateNavButtons() {
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const indicator = document.getElementById('tab-nav-indicator');
    if (btnPrev) btnPrev.disabled = activeTab === 0;
    if (btnNext) btnNext.disabled = activeTab === totalTabs - 1;
    if (indicator) indicator.innerHTML = `<strong>${activeTab + 1}</strong> / ${totalTabs}`;
  }

  function scrollTabBar(px) {
    const bar = document.getElementById('tab-bar');
    bar.scrollBy({ left: px, behavior: 'smooth' });
  }

  function updateArrows() {
    const bar = document.getElementById('tab-bar');
    const leftArrow  = document.getElementById('tab-arrow-left');
    const rightArrow = document.getElementById('tab-arrow-right');
    if (!bar) return;
    leftArrow.style.opacity  = bar.scrollLeft > 4 ? '1' : '0';
    leftArrow.style.pointerEvents = bar.scrollLeft > 4 ? 'auto' : 'none';
    const atEnd = bar.scrollLeft + bar.clientWidth >= bar.scrollWidth - 4;
    rightArrow.style.opacity      = atEnd ? '0' : '1';
    rightArrow.style.pointerEvents = atEnd ? 'none' : 'auto';
  }

  async function loadMateri(level) {
    try {
      const res = await fetch(
        `${SUPA_URL}/rest/v1/kurikulum?level=eq.${encodeURIComponent(level)}&select=id,level,materi,deskripsi,filepdf&order=id.asc`,
        { headers: HEADERS }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();

      if (!rows || rows.length === 0) {
        setEl('empty-level-label', level);
        showMateriState('empty');
        return;
      }

      buildTabs(rows);
      showMateriState('content');
    } catch (err) {
      console.error('[Materi]', err);
      setEl('error-msg-text', `Gagal memuat materi: ${err.message}`);
      showMateriState('error');
    }
  }

  /* ===== LOAD PROFIL DARI SUPABASE ===== */
  async function init() {
    loginData = JSON.parse(localStorage.getItem('kenz-login') || 'null');
    if (!loginData || !loginData.username) {
      alert('Sesi habis atau belum login. Silakan login kembali.');
      window.location.href = 'index.html';
      return;
    }

    try {
      const res = await fetch(
        `${SUPA_URL}/rest/v1/datasiswa?username=eq.${encodeURIComponent(loginData.username)}&select=id,nama_siswa,level,instrumen,photo&limit=1`,
        { headers: HEADERS }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();

      if (!rows || rows.length === 0) {
        alert('Data siswa tidak ditemukan. Hubungi admin.');
        window.location.href = 'index.html';
        return;
      }

      const row = rows[0];
      const siswa = {
        id        : row.id || loginData.id || '—',
        nama      : row.nama_siswa || loginData.nama || '—',
        level     : row.level || loginData.level || 'Basic',
        instrumen : row.instrumen || loginData.instrumen || '—',
        photo     : row.photo || loginData.photo || null,
      };

      renderIdentitas(siswa);
      await loadMateri(siswa.level);

    } catch (err) {
      console.error('[Init]', err);
      // Fallback ke localStorage jika fetch gagal
      const fallback = {
        id       : loginData.id        || '—',
        nama     : loginData.nama      || loginData.nama_siswa || '—',
        level    : loginData.level     || 'Basic',
        instrumen: loginData.instrumen || '—',
        photo    : loginData.photo     || null,
      };
      renderIdentitas(fallback);
      await loadMateri(fallback.level);
    }
  }

  init();
</script>
</body>
</html>
