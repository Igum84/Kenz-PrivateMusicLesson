<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Jadwal Les – KENZ Guitar Lesson</title>
  <style>
    /* ===== TOKENS (sama dengan materi.html / adminsiswa.html) ===== */
    :root {
      --gold: #D4AF37;
      --gold2: #F0C84A;
      --gold-dim: rgba(212,175,55,0.12);
      --gold-border: rgba(212,175,55,0.3);
      --text: #0F0D08;
      --muted: #6B6459;
      --bg: #F7F4EE;
      --surface: #FFFFFF;
      --surface2: #F0EDE5;
      --border: #E2DDD4;
      --nav-bg: rgba(247,244,238,0.92);
      --footer-bg: #0F0D08;
      --footer-text: #5A5249;
      --green: #2D8A5F;
      --green-dim: rgba(45,138,95,0.12);
      --blue: #2D5FA8;
      --blue-dim: rgba(45,95,168,0.12);
      --purple: #7A3EA6;
      --purple-dim: rgba(122,62,166,0.12);
      --red: #C84040;
      --red-dim: rgba(200,64,64,0.12);
      --radius: 16px;
      --shadow: 0 2px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
      --font: 'Times New Roman', Times, Georgia, serif;
    }
    [data-theme="dark"] {
      --text: #F0EDE5;
      --muted: #9A9080;
      --bg: #0C0A06;
      --surface: #181510;
      --surface2: #201C14;
      --border: #2A2518;
      --nav-bg: rgba(12,10,6,0.92);
      --footer-bg: #080604;
      --footer-text: #3A3228;
      --gold-dim: rgba(212,175,55,0.10);
      --shadow: 0 2px 16px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background .35s, color .35s;
      min-height: 100vh;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: sticky; top: 0; z-index: 200;
      background: #0F0D08;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212,175,55,0.18);
      box-shadow: 0 2px 20px rgba(0,0,0,0.45);
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 64px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      font-family: var(--font); font-size: 22px; font-weight: 700;
      color: var(--gold);
    }
    .nav-brand img { height: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .nav-back {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(212,175,55,0.2);
      border-radius: 10px; padding: 7px 14px;
      color: #F0EDE5; font-size: 13px; font-weight: 600;
      text-decoration: none; font-family: var(--font);
      transition: background .2s, border-color .2s;
    }
    .nav-back:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .theme-toggle {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px; padding: 8px 10px;
      font-size: 17px; cursor: pointer;
      transition: background .2s, border-color .2s; line-height: 1;
    }
    .theme-toggle:hover { border-color: var(--gold); background: rgba(212,175,55,0.12); }
    .admin-info {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px 7px 7px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(212,175,55,0.2);
      border-radius: 50px;
    }
    .admin-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #7A5020);
      display: flex; align-items: center; justify-content: center;
      color: #0A0A0A; font-weight: 700; font-size: 14px; flex-shrink: 0;
      overflow: hidden;
    }
    .admin-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .admin-name { font-size: 13px; font-weight: 600; color: #F0EDE5; font-family: var(--font); }
    .admin-role { font-size: 11px; color: #9A9080; font-family: var(--font); }

    /* ===== MAIN ===== */
    .main-wrap {
      padding: 24px 10px 80px;
    }

    /* ===== ANIMATIONS ===== */
    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    .fi-1{animation-delay:.05s} .fi-2{animation-delay:.10s} .fi-3{animation-delay:.15s}

    /* ===== PAGE TITLE ===== */
    .page-title-row {
      max-width: 1400px; margin: 0 auto 18px; padding: 0 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .page-title-icon { font-size: 24px; }
    .page-title {
      font-family: var(--font); font-size: 22px; font-weight: 700;
      color: var(--text);
    }

    /* ===== IDENTITAS SISWA CARD ===== */
    .identitas-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: hidden;
      transition: background .35s, border-color .35s;
    }
    .identitas-banner {
      height: 6px;
      background: linear-gradient(90deg, #1a1200, #7A5020, var(--gold), #7A5020, #1a1200);
    }
    .identitas-body {
      padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .identitas-photo {
      width: 58px; height: 58px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #7A5020);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #0A0A0A;
      flex-shrink: 0; overflow: hidden;
      border: 3px solid var(--gold-border);
      box-shadow: 0 2px 12px rgba(212,175,55,0.25);
    }
    .identitas-photo img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .identitas-info { flex: 1; min-width: 0; }
    .identitas-nama {
      font-family: var(--font); font-size: 17px; font-weight: 700;
      color: var(--text); line-height: 1.2; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .identitas-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .identitas-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      color: var(--gold); border-radius: 99px;
      padding: 2px 10px; font-size: 11px; font-weight: 700;
      font-family: var(--font);
    }
    .identitas-sep { color: var(--border); font-size: 12px; }
    .identitas-instrumen {
      font-size: 12px; color: var(--muted); font-family: var(--font);
    }
    .identitas-right {
      text-align: right; flex-shrink: 0;
    }
    .identitas-id {
      font-size: 11px; color: var(--muted); font-family: var(--font);
      margin-bottom: 2px;
    }
    .identitas-id span {
      font-weight: 700; color: var(--gold);
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ===== JADWAL CARD ===== */
    .jadwal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: background .35s, border-color .35s;
    }
    .jadwal-card-header {
      padding: 14px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      display: flex; align-items: center; gap: 10px;
    }
    .jadwal-card-header-icon { font-size: 18px; }
    .jadwal-card-title {
      font-family: var(--font); font-size: 14px; font-weight: 700;
      color: var(--gold); letter-spacing: .3px;
    }
    .jadwal-count {
      margin-left: auto;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      color: var(--gold); border-radius: 99px;
      padding: 2px 10px; font-size: 11px; font-weight: 700;
      font-family: var(--font);
    }

    /* ===== JADWAL LIST ===== */
    .jadwal-list { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .jadwal-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color .2s, background .2s;
    }
    .jadwal-item.lewat { opacity: .55; }
    .jadwal-item:hover { border-color: var(--gold-border); }
    .jadwal-date-box {
      flex-shrink: 0;
      width: 58px; height: 58px;
      border-radius: 12px;
      background: #0F0D08;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--gold);
      border: 1px solid rgba(212,175,55,0.3);
    }
    .jadwal-date-day { font-size: 19px; font-weight: 800; line-height: 1.1; font-family: var(--font); }
    .jadwal-date-month { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #C9BF9F; }
    .jadwal-info { flex: 1; min-width: 0; }
    .jadwal-hari {
      font-family: var(--font); font-size: 14px; font-weight: 700;
      color: var(--text); margin-bottom: 2px;
    }
    .jadwal-tahun { font-size: 12px; color: var(--muted); font-family: var(--font); }
    .jadwal-right {
      flex-shrink: 0; text-align: right;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    }
    .jadwal-sesi-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      color: var(--gold); border-radius: 99px;
      padding: 4px 12px; font-size: 12px; font-weight: 700;
      font-family: var(--font); white-space: nowrap;
    }
    .jadwal-status {
      font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
      text-transform: uppercase; font-family: var(--font);
      padding: 2px 9px; border-radius: 99px;
    }
    .jadwal-status.akan-datang { background: var(--green-dim); color: var(--green); }
    .jadwal-status.hari-ini { background: var(--blue-dim); color: var(--blue); }
    .jadwal-status.lewat { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

    /* ===== EMPTY & ERROR STATE ===== */
    .state-box {
      padding: 48px 20px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .state-icon { font-size: 42px; opacity: .35; }
    .state-text { font-family: var(--font); font-size: 14px; color: var(--muted); line-height: 1.6; }

    /* ===== SKELETON JADWAL ===== */
    .jadwal-skeleton { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .jadwal-skeleton-row { height: 58px; border-radius: 12px; }

    /* ===== FOOTER ===== */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--footer-bg);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 20px 24px;
      z-index: 100;
    }
    .footer-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      color: var(--footer-text); font-size: 12px; font-family: var(--font);
      flex-wrap: wrap; gap: 8px;
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width:640px){
      .nav-inner { padding: 0 14px; height: 56px; }
      .nav-brand { font-size: 18px; gap: 8px; }
      .nav-brand img { height: 26px; }
      .admin-info { display: none; }
      .main-wrap { padding: 16px 12px 72px; }
      .identitas-right { display: none; }
      .jadwal-item { flex-wrap: wrap; }
      .jadwal-right { align-items: flex-start; text-align: left; }
    }
    @media(min-width:641px){
      .main-wrap { padding: 24px 10px 80px; }
    }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav>
  <div class="nav-inner">
    <a href="adminsiswa.html" class="nav-brand">
      <img id="nav-logo" src="logo.png" alt="KENZ" style="display:none">

</nav>

<!-- ===== MAIN ===== -->
<div class="main-wrap">

  <!-- JUDUL HALAMAN -->
  <div class="page-title-row fade-in">
    <span class="page-title-icon">🗓️</span>
    <span class="page-title">Jadwal Les</span>
  </div>

  <!-- SKELETON IDENTITAS -->
  <div id="identitas-skeleton" class="identitas-card fade-in" style="padding:16px 20px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="skeleton" style="width:58px;height:58px;border-radius:50%;flex-shrink:0;"></div>
      <div style="flex:1;">
        <div class="skeleton" style="height:16px;border-radius:6px;margin-bottom:8px;width:50%;"></div>

  <!-- IDENTITAS SISWA CARD -->

  <!-- JADWAL CARD -->
  <div class="jadwal-card fade-in fi-2">

      <span class="jadwal-card-title">JADWAL LES SAYA</span>
      <span class="jadwal-count" id="jadwal-count" style="display:none;"></span>

    <!-- SKELETON JADWAL -->
    <div id="jadwal-skeleton" class="jadwal-skeleton">
      <div class="skeleton jadwal-skeleton-row"></div>
      <div class="skeleton jadwal-skeleton-row"></div>
      <div class="skeleton jadwal-skeleton-row"></div>
    </div>

    <!-- LIST JADWAL (diisi JS) -->
    <div id="jadwal-list" class="jadwal-list" style="display:none;"></div>

    <!-- EMPTY STATE -->
    <div id="jadwal-empty" style="display:none;">
      <div class="state-box">
        <div class="state-icon">🗓️</div>
        <div class="state-text">
          Belum ada jadwal les yang tersedia.<br>
          Hubungi admin untuk mengatur jadwal les kamu.
        </div>
      </div>
    </div>

    <!-- ERROR STATE -->
    <div id="jadwal-error" style="display:none;">
      <div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-text" id="jadwal-error-text">Gagal memuat jadwal. Periksa koneksi internet.</div>
      </div>
    </div>

  </div><!-- /jadwal-card -->

</div><!-- /main-wrap -->

<!-- FOOTER -->
<footer>
  <div class="footer-inner">
    <span>🎸 KENZ Guitar Lesson</span>
    <span>Jadwal Les &copy; <span id="footer-year">2025</span></span>
  </div>
</footer>

<script>
  /* ===== THEME ===== */
  const html     = document.documentElement;
  const themeBtn = document.getElementById('theme-toggle');
  const saved    = localStorage.getItem('kenz-theme') || 'light';
  html.setAttribute('data-theme', saved);
  themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('kenz-theme', next);
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  /* ===== LOGO ===== */
  const logoImg = document.getElementById('nav-logo');
  const logoFb  = document.getElementById('nav-logo-fallback');
  logoImg.onload  = () => { logoImg.style.display = 'block'; logoFb.style.display = 'none'; };
  logoImg.onerror = () => { logoImg.style.display = 'none';  logoFb.style.display = 'inline'; };

  /* ===== FOOTER YEAR ===== */
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  /* ===== SUPABASE CONFIG ===== */
  const SUPA_URL = 'https://pedhdhvybqfnxucvrkzj.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZGhkaHZ5YnFmbnh1Y3Zya3pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjU1MzIsImV4cCI6MjA5NTk0MTUzMn0.oPu3fkqNMWlb_7cTq738vHmKc6d4WiYiCBo9sMv3K7k';
  const HEADERS  = { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` };

  /* ===== HELPERS ===== */
  function setEl(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  const NAMA_HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const NAMA_BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const NAMA_BULAN_PANJANG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  function parseTanggal(tanggalStr) {
    // tanggalStr format YYYY-MM-DD dari kolom date Supabase
    const [y, m, d] = tanggalStr.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  /* ===== IDENTITAS SISWA ===== */
  let loginData = null;

  function renderIdentitas(data) {
    const inisial = (data.nama || 'S').charAt(0).toUpperCase();

    // Navbar
    const navAvatar = document.getElementById('nav-avatar');
    if (data.photo) {
      navAvatar.innerHTML = `<img src="${data.photo}" alt="${inisial}">`;
    } else {
      navAvatar.textContent = inisial;
    }
    setEl('nav-siswa-nama', data.nama || '—');

    // Card identitas
    const photoEl = document.getElementById('id-photo-el');
    if (data.photo) {
      photoEl.innerHTML = `<img src="${data.photo}" alt="${inisial}">`;
    } else {
      photoEl.textContent = inisial;
    }
    setEl('id-nama',      data.nama      || '—');
    setEl('id-level',     data.level     || '—');
    setEl('id-instrumen', data.instrumen || '—');
    setEl('id-siswa',     data.id        || '—');

    document.getElementById('identitas-skeleton').style.display = 'none';
    document.getElementById('identitas-card').style.display     = 'block';
  }

  /* ===== JADWAL LES ===== */
  function showJadwalState(state) {
    document.getElementById('jadwal-skeleton').style.display = 'none';
    document.getElementById('jadwal-list').style.display    = state === 'content' ? 'flex' : 'none';
    document.getElementById('jadwal-empty').style.display   = state === 'empty'   ? 'block' : 'none';
    document.getElementById('jadwal-error').style.display   = state === 'error'   ? 'block' : 'none';
  }

  function renderJadwalList(rows) {
    const list = document.getElementById('jadwal-list');
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    list.innerHTML = rows.map(row => {
      const tgl    = parseTanggal(row.tanggal);
      const hari   = NAMA_HARI[tgl.getDay()];
      const bulan  = NAMA_BULAN[tgl.getMonth()];
      const bulanPanjang = NAMA_BULAN_PANJANG[tgl.getMonth()];

      let statusClass = 'akan-datang';
      let statusLabel = 'Akan Datang';
      let itemClass   = '';
      if (tgl.getTime() === today.getTime()) {
        statusClass = 'hari-ini';
        statusLabel = 'Hari Ini';
      } else if (tgl.getTime() < today.getTime()) {
        statusClass = 'lewat';
        statusLabel = 'Selesai';
        itemClass   = 'lewat';
      }

      return `
        <div class="jadwal-item ${itemClass}">
          <div class="jadwal-date-box">
            <div class="jadwal-date-day">${tgl.getDate()}</div>
            <div class="jadwal-date-month">${bulan}</div>
          </div>
          <div class="jadwal-info">
            <div class="jadwal-hari">${hari}, ${tgl.getDate()} ${bulanPanjang}</div>
            <div class="jadwal-tahun">${tgl.getFullYear()}</div>
          </div>
          <div class="jadwal-right">
            <span class="jadwal-sesi-badge">🎸 ${row.sesi || '—'}</span>
            <span class="jadwal-status ${statusClass}">${statusLabel}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadJadwal(idSiswa) {
    try {
      const res = await fetch(
        `${SUPA_URL}/rest/v1/jadwalles?id_siswa=eq.${encodeURIComponent(idSiswa)}&select=id,id_siswa,nama_siswa,sesi,tanggal&order=tanggal.asc`,
        { headers: HEADERS }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();

      const countEl = document.getElementById('jadwal-count');
      if (!rows || rows.length === 0) {
        countEl.style.display = 'none';
        showJadwalState('empty');
        return;
      }

      countEl.textContent = `${rows.length} Jadwal`;
      countEl.style.display = 'inline-flex';

      renderJadwalList(rows);
      showJadwalState('content');
    } catch (err) {
      console.error('[Jadwal]', err);
      setEl('jadwal-error-text', `Gagal memuat jadwal: ${err.message}`);
      showJadwalState('error');
    }
  }

  /* ===== LOAD PROFIL DARI SUPABASE ===== */
  async function init() {
    loginData = JSON.parse(localStorage.getItem('kenz-login') || 'null');
    if (!loginData || !loginData.username) {
      alert('Sesi habis atau belum login. Silakan login kembali.');
      window.location.href = 'index.html';
      return;
    }

    try {
      const res = await fetch(
        `${SUPA_URL}/rest/v1/datasiswa?username=eq.${encodeURIComponent(loginData.username)}&select=id,nama_siswa,level,instrumen,photo&limit=1`,
        { headers: HEADERS }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();

      if (!rows || rows.length === 0) {
        alert('Data siswa tidak ditemukan. Hubungi admin.');
        window.location.href = 'index.html';
        return;
      }

      const row = rows[0];
      const siswa = {
        id        : row.id || loginData.id || '—',
        nama      : row.nama_siswa || loginData.nama || '—',
        level     : row.level || loginData.level || 'Basic',
        instrumen : row.instrumen || loginData.instrumen || '—',
        photo     : row.photo || loginData.photo || null,
      };

      renderIdentitas(siswa);
      await loadJadwal(siswa.id);

    } catch (err) {
      console.error('[Init]', err);
      // Fallback ke localStorage jika fetch gagal
      const fallback = {
        id       : loginData.id        || '—',
        nama     : loginData.nama      || loginData.nama_siswa || '—',
        level    : loginData.level     || 'Basic',
        instrumen: loginData.instrumen || '—',
        photo    : loginData.photo     || null,
      };
      renderIdentitas(fallback);
      await loadJadwal(fallback.id);
    }
  }

  init();
</script>
</body>
</html>
